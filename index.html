<!DOCTYPE html>
<html>
<head>
<title>GLIMORA</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#fff5fa;
    color:#222;
}

header{
    background:white;
    padding:18px;
    display:flex;
    justify-content:space-between;
    box-shadow:0 2px 10px #ddd;
}

.logo{
    font-size:25px;
    font-weight:bold;
    letter-spacing:3px;
}

.cart{
    background:#222;
    color:white;
    padding:10px 15px;
    border-radius:20px;
}

.hero{
    text-align:center;
    padding:60px 20px;
    background:#ffe1ee;
}

.hero h1{
    font-size:45px;
}

.hero button{
    background:#222;
    color:white;
    border:0;
    padding:14px 30px;
    border-radius:25px;
}

.categories{
    text-align:center;
    padding:30px 15px;
}

.category{
    display:inline-block;
    background:white;
    padding:12px 18px;
    margin:5px;
    border-radius:20px;
}

.products{
    padding:20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:20px;
}

.product{
    background:white;
    padding:15px;
    border-radius:15px;
    box-shadow:0 3px 12px #ddd;
}

.product img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:12px;
}

.price{
    font-weight:bold;
    margin:10px 0;
}

.whatsapp{
    width:100%;
    padding:12px;
    border:0;
    border-radius:8px;
    background:#25D366;
    color:white;
    font-weight:bold;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:25px;
}
</style>
</head>

<body>

<header>
    <div class="logo">✦ GLIMORA</div>
    <div class="cart">🛒 Cart</div>
</header>

<section class="hero">
    <h1>GLIMORA ✨</h1>
    <p>Little things. Big sparkle.</p>
    <button onclick="location.href='#products'">
        Shop Now
    </button>
</section>

<section class="categories">

<h2>Shop By Category</h2>

<div class="category">💍 Rings</div>
<div class="category">✨ Earrings</div>
<div class="category">📿 Necklaces</div>
<div class="category">🎀 Hair Accessories</div>

</section>

<h2 style="text-align:center;">Our Products</h2>

<section class="products" id="products">

<div class="product">

<img src="https://images.unsplash.com/photo-1605100804763-247f67b3557e">

<h3>Elegant Pearl Ring</h3>

<div class="price">₹199</div>

<button class="whatsapp"
onclick="order('Elegant Pearl Ring','199')">

📲 Order on WhatsApp

</button>

</div>


<div class="product">

<img src="https://images.unsplash.com/photo-1535632066927-ab7c9ab60908">

<h3>Pearl Earrings</h3>

<div class="price">₹249</div>

<button class="whatsapp"
onclick="order('Pearl Earrings','249')">

📲 Order on WhatsApp

</button>

</div>


<div class="product">

<img src="https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f">

<h3>Simple Necklace</h3>

<div class="price">₹349</div>

<button class="whatsapp"
onclick="order('Simple Necklace','349')">

📲 Order on WhatsApp

</button>

</div>

</section>

<footer>

<h3>✦ GLIMORA</h3>

<p>Little things. Big sparkle.</p>

<p>© 2026 GLIMORA</p>

</footer>


<script>

function order(product,price){

let number="91**********";

let message=
"Hello GLIMORA ✨\n\n"+
"I want to order:\n\n"+
"Product: "+product+"\n"+
"Price: ₹"+price;

let link=
"https://wa.me/"+number+
"?text="+encodeURIComponent(message);

window.open(link,"_blank");

}

</script>

</body>
</html>
