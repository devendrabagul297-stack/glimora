<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GLIMORA - Fashion Accessories</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<header class="header">

  <div class="logo">
    GLIMORA
  </div>

  <div class="search-box">
    <input
      type="text"
      id="searchInput"
      placeholder="Search products..."
      onkeyup="searchProducts()"
    >
  </div>

  <button class="cart-btn" onclick="openCart()">
    🛒 Cart <span id="cartCount">0</span>
  </button>

</header>


<!-- HERO -->
<section class="hero">

  <h1>Welcome to GLIMORA ✨</h1>

  <p>Trendy Accessories for Everyone</p>

  <button onclick="showCategory('all')">
    Shop Now
  </button>

</section>


<!-- CATEGORY BUTTONS -->
<section class="categories">

  <button onclick="showCategory('all')">
    All
  </button>

  <button onclick="showCategory('girls')">
    👧 Girls
  </button>

  <button onclick="showCategory('boys')">
    👦 Boys
  </button>

  <button onclick="showCategory('rings')">
    💍 Rings
  </button>

  <button onclick="showCategory('earrings')">
    ✨ Earrings
  </button>

  <button onclick="showCategory('bracelets')">
    📿 Bracelets
  </button>

</section>


<!-- PRODUCTS -->
<main>

  <h2 class="section-title">
    Our Products
  </h2>

  <div id="productContainer" class="product-container">
  </div>

</main>


<!-- PRODUCT DETAILS MODAL -->
<div id="productModal" class="modal">

  <div class="modal-content">

    <span class="close" onclick="closeProduct()">
      ×
    </span>

    <img id="modalImage" src="" alt="Product">

    <h2 id="modalName"></h2>

    <h3 id="modalPrice"></h3>

    <p id="modalDescription"></p>

    <button id="modalBuyBtn" class="buy-btn">
      Buy Now
    </button>

    <button id="modalCartBtn" class="cart-add-btn">
      Add to Cart
    </button>

  </div>

</div>


<!-- CART -->
<div id="cartModal" class="modal">

  <div class="modal-content cart-content">

    <span class="close" onclick="closeCart()">
      ×
    </span>

    <h2>🛒 Your Cart</h2>

    <div id="cartItems"></div>

    <div class="cart-total">
      Total: ₹<span id="cartTotal">0</span>
    </div>

    <button class="checkout-btn" onclick="openCheckout()">
      Proceed to Checkout
    </button>

  </div>

</div>


<!-- CHECKOUT -->
<div id="checkoutModal" class="modal">

  <div class="modal-content checkout-content">

    <span class="close" onclick="closeCheckout()">
      ×
    </span>

    <h2>📦 Checkout</h2>

    <div class="checkout-summary">

      <h3>Order Total</h3>

      <h1 id="checkoutTotal">
        ₹0
      </h1>

    </div>


    <!-- CUSTOMER DETAILS -->
    <input
      type="text"
      id="customerName"
      placeholder="Your Name"
    >

    <input
      type="tel"
      id="customerPhone"
      placeholder="Mobile Number"
    >

    <textarea
      id="customerAddress"
      placeholder="Delivery Address"
    ></textarea>


    <!-- PAYMENT -->
    <h3>Payment Method</h3>

    <select id="paymentMethod" onchange="paymentChanged()">

      <option value="cod">
        Cash on Delivery
      </option>

      <option value="upi">
        UPI
      </option>

    </select>


    <!-- UPI BOX -->
    <div id="upiBox" class="upi-box">

      <p>
        Pay exact amount using UPI
      </p>

      <button
        id="upiPayBtn"
        class="upi-btn"
        onclick="payWithUPI()"
      >
        Pay ₹0 with UPI
      </button>

      <p class="upi-note">
        UPI ID:
        <strong id="upiDisplay">
          YOURUPI@upi
        </strong>
      </p>

    </div>


    <!-- ORDER BUTTON -->
    <button
      class="order-btn"
      onclick="placeOrder()"
    >
      📲 Place Order on WhatsApp
    </button>

  </div>

</div>


<script src="script.js"></script>

</body>
       </html>
